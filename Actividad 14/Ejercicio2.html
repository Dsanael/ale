<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 3fr 2fr 2fr 1fr;
            grid-template-rows: 150px 100px 100px 150px;
            gap: 10px; 
            width: 900px;
            height: 550px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .item1 {
            grid-column: 1;
            grid-row: 1 / span 4;
            background-color: rgb(213, 99, 42);
        }
        .item2 {
            grid-column: 2 /span 2;
            grid-row: 1;
            background-color: rgb(199, 42, 213);
        }
        .item3 {
            grid-column: 2;
            grid-row: 2 / span 2;
            background-color: rgb(62, 182, 22);
        }
        .item4 {
        grid-column: 3;
        grid-row: 2;
        background-color: #3498db;
        }
        .item5 {
        grid-column: 3;
        grid-row: 3;
        background-color: rgb(166, 137, 189);
        }
        .item6 {
        grid-column: 2 / span 2;
        grid-row: 4;
        background-color: #f39c12;
        }
        .item7 {
        grid-column: 4;
        grid-row: 1 / span 4;
        background-color: #21904f;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="item7"></div>
</body>
</html>
