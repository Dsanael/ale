<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr 1.5fr;
            grid-template-rows: 80px 70px 100px 65px 65px;
            gap: 10px; 
            width: 900px;
            height: 520px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .item1 {
            grid-column: 1 /span 6;
            grid-row: 1;
            background-color: rgb(110, 54, 142);
        }
        .item2 {
            grid-column: 1;
            grid-row: 2 / span 5;
            background-color: #f4a629;
        }
        .item3 {
            grid-column: 2 / span 5;
            grid-row: 2;
            background-color: #16a250;
        }
        .item4 {
            grid-column: 2 / span 3;
            grid-row: 3;
            background-color: #42a5e6;
        }
        .item5 {
            grid-column: 5 / span 2;
            grid-row: 3;
            background-color: #42a5e6;
        }

        .item6-morado1 { grid-column: 2; grid-row: 4 / span 2; background-color: #9b78b5; }
        .item6-morado2 { grid-column: 3; grid-row: 4 / span 2; background-color: #9b78b5; }
        .item6-rojo1 { grid-column: 4; grid-row: 4; background-color: #f02d13; }
        .item6-rojo2 { grid-column: 4; grid-row: 5; background-color: #f02d13; }
        .item6-morado3 { grid-column: 5; grid-row: 4 / span 2; background-color: #9b78b5; }
        .item6-morado4 { grid-column: 6; grid-row: 4 / span 2; background-color: #9b78b5; }
        
        .item7 {
            grid-column: 7;
            grid-row: 1 / span 6;
            background-color: #f39c12;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="item7"></div>
        <div class="item6-morado1"></div>
        <div class="item6-morado2"></div>
        <div class="item6-morado3"></div>
        <div class="item6-morado4"></div>
        <div class="item6-rojo1"></div>
        <div class="item6-rojo2"></div>
</body>
</html>
