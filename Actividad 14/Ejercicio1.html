<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 2fr 3fr 2fr;
            grid-template-rows: 150px 150px 150px; 
            gap: 10px; 
            width: 850px;
            height: 500px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .item1 {
            grid-column: 1 / span 2;
            grid-row: 1;             /* Fila 1 */
            background-color: #8b43b9;
        }
        .item2 {
            grid-column: 1;          
            grid-row: 2;             /* Fila 2 */
            background-color: #e74c3c;
        }
        .item3{
            grid-column: 2;
            grid-row: 2;
            background-color:#27ae60;
        }
        .item4 {
            grid-column: 1;          /* Columna 1 */
            grid-row: 3;             /* Fila 3 */
            background-color: #9577ad;
        }
        .item5 {
            grid-column: 2;          /* Columna 2 */
            grid-row: 3;             /* Fila 3 */
            background-color: #f39c12; 
        }
        .item6 {
            grid-column: 3;          /* Columna 2 */
            grid-row: 1 / span 3;             /* Fila 1, 2, 3 */
            background-color: #48a9f4;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
    </div>
</body>
</html>
